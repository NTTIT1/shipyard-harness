server:
  port: 9080
  # Browsers reach the platform through the dashboard (BFF); set GATEWAY_BIND_ADDR=0.0.0.0 to expose it.
  address: ${GATEWAY_BIND_ADDR:127.0.0.1}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: orchestrator
          uri: ${ORCHESTRATOR_SERVICE_URL:http://localhost:9084}
          order: -10
          predicates:
            - Path=/api/v1/runs/**,/api/v1/approvals/**,/api/v1/projects/*/gate-policy,/api/v1/projects/*/workflow,/api/v1/projects/*/delivery,/api/v1/projects/*/runs
        - id: context
          uri: ${CONTEXT_SERVICE_URL:http://localhost:9085}
          order: -10
          predicates:
            - Path=/api/v1/projects/*/memory,/api/v1/projects/*/memory/**
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:9081}
          predicates:
            - Path=/api/v1/auth/**

        - id: project-service
          uri: ${PROJECT_SERVICE_URL:http://localhost:9082}
          predicates:
            - Path=/api/v1/projects/**

        - id: lane-service-lanes
          uri: ${LANE_SERVICE_URL:http://localhost:9083}
          predicates:
            - Path=/api/v1/lanes/**

        - id: lane-service-project-lanes
          uri: ${LANE_SERVICE_URL:http://localhost:9083}
          order: -5
          predicates:
            - Path=/api/v1/projects/{projectId}/lanes/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

shipyard:
  jwt:
    secret: ${JWT_SECRET:shipyard-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256}
