services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shipyard-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PG_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # New volume name: an old postgres:16-alpine (musl) data dir must not be opened by this
      # Debian (glibc) image — text indexes would silently break. Old data stays in shipyard_pgdata.
      - shipyard_pgvector16_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shipyard-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - shipyard_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: shipyard-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBIT_PORT:-5673}:5672"
      - "127.0.0.1:${RABBIT_UI_PORT:-15673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - shipyard_rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  shipyard_pgvector16_data:
  shipyard_redisdata:
  shipyard_rabbitmqdata:
