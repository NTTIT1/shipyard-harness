server:
  port: 9081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5434}/auth_db
    username: ${PG_USER:postgres}
    password: ${PG_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

shipyard:
  admin:
    email: ${ADMIN_EMAIL:admin@shipyard.local}
    password: ${ADMIN_PASSWORD:admin123}
  jwt:
    secret: ${JWT_SECRET:shipyard-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256}
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
